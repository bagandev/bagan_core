[package]
name = "bagan_core"
version = "0.1.0"
edition = "2024"

[dependencies]
liquid = "0.26.11"
liquid-core = "0.26.11"
napi = { version = "3", features = ["napi8", "serde-json", "async", "tokio_rt"] }
napi-derive = "3"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde_yml = "0.0.13"
notify = "9.0.0"
globset = "0.4.22"

[build-dependencies]
napi-build = "2"

[lib]
name = "bagan_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]