[package]
name = "bagan_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
liquid = "0.26.11"
liquid-core = "0.26.11"
napi = { version = "3", features = ["napi8", "serde-json", "async", "tokio_rt"] }
napi-derive = "3"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread","fs", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yml = "0.0.13"
notify-debouncer-full = "0.8.0"
globset = "0.4.22"
regex = "1"
async-recursion = "1.2.0"
blake3 = "1.8.7"
dashmap = { version = "6.2.1", features = ["serde"] }
postcard = { version = "1.2.0", features = ["alloc"] }

[build-dependencies]
napi-build = "2"

[lib]
name = "bagan_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]